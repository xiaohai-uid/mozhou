name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  DATABASE_URL: postgres://mozhou:mozhou_dev@localhost:5433/mozhou
  AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
  CHAT_PROVIDER: mock
  DISTILL_PROVIDER: mock
  DECONSTRUCT_PROVIDER: mock
  DRAW_PROVIDER: mock
  SOURCE_PROVIDER: mock
  WEBSEARCH_PROVIDER: mock
  RANKINGS_PROVIDER: mock
  SYNC_PROVIDER: mock
  FANQIE_SEARCH_MOCK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  workspace:
    name: pnpm workspace / apps-web
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: "skip"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @mozhou/web test
      - run: pnpm --filter @mozhou/web build
      - name: Upload apps/web preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: apps-web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Create claimable Vercel preview
        shell: bash
        run: |
          set -uo pipefail
          tar -czf "$RUNNER_TEMP/apps-web-dist.tgz" -C apps/web/dist .
          set +e
          HTTP_STATUS=$(curl -sS -o "$RUNNER_TEMP/vercel-preview.json" -w '%{http_code}' -X POST 'https://codex-deploy-skills.vercel.sh/api/deploy' \
            -F "file=@$RUNNER_TEMP/apps-web-dist.tgz" \
            -F 'framework=null')
          CURL_EXIT=$?
          set -e
          printf '{"curlExit":%s,"httpStatus":"%s"}\n' "$CURL_EXIT" "$HTTP_STATUS" > "$RUNNER_TEMP/vercel-preview-meta.json"
          echo "Vercel claim endpoint HTTP status: $HTTP_STATUS (curl exit $CURL_EXIT)"
      - name: Upload Vercel preview response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-response
          path: |
            ${{ runner.temp }}/vercel-preview.json
            ${{ runner.temp }}/vercel-preview-meta.json
          if-no-files-found: error
          retention-days: 1
      - name: Validate Vercel preview response
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.RUNNER_TEMP + '/vercel-preview.json';
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!p.previewUrl || !p.claimUrl) {
            console.error('Vercel claim deployment failed:', p.error ?? p.message ?? 'missing previewUrl/claimUrl');
            process.exit(1);
          }
          console.log('claimable preview created');
          NODE

  gate:
    name: typecheck / lint / unit+http / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mozhou
          POSTGRES_PASSWORD: mozhou_dev
          POSTGRES_DB: mozhou
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mozhou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Apply database schema
        run: npx drizzle-kit migrate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mozhou
          POSTGRES_PASSWORD: mozhou_dev
          POSTGRES_DB: mozhou
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mozhou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Apply database schema
        run: npx drizzle-kit migrate
      - run: npx playwright install --with-deps chromium
      - run: node node_modules/@playwright/test/cli.js test
