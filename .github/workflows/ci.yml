# Novel OS 主线 CI（ADR-0025 · 2026-08-30 审查修复）：
# pnpm workspace（packages/* + apps/web）的构建与全量测试在 master 推送/PR 上强制运行。
# Legacy app/ 的 CI 原样迁至 legacy-app.yml（触发面保持 main）。
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  novel-os:
    name: build / test (packages/* + apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace (tsc -b)
        run: pnpm build
      - name: Test workspace (vitest)
        run: pnpm test
      - name: Typecheck apps/web (tsc -b)
        run: pnpm --filter @mozhou/web typecheck
      - name: Test apps/web (vitest)
        run: pnpm --filter @mozhou/web test
      - name: Build apps/web (vite)
        run: pnpm --filter @mozhou/web build
