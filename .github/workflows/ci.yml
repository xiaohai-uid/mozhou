# Novel OS 主线 CI：构建、测试、类型检查、静态检查与依赖漏洞门禁。
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  novel-os:
    name: build / test / security (packages/* + apps/web)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high
      - name: Static lint gate
        run: pnpm lint
      - name: Build workspace (tsc -b)
        run: pnpm build
      - name: Test workspace (vitest)
        run: pnpm test
      - name: Typecheck apps/web (tsc -b)
        run: pnpm --filter @mozhou/web typecheck
      - name: Test apps/web (vitest)
        run: pnpm --filter @mozhou/web test
      - name: Build apps/web (vite)
        run: pnpm --filter @mozhou/web build
