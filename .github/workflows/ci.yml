# Novel OS 主线 CI：构建、测试、类型检查、静态检查与依赖漏洞门。
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  novel-os:
    name: build / test / security (packages/* + apps/web)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high
      - name: Build workspace (tsc -b)
        run: pnpm build
      # 类型感知 lint 依赖 packages/*/dist 的 .d.ts（types 指向 dist），
      # 必须在 workspace 构建之后执行，否则工作区导入全部坍缩为 any 产生千级误报。
      - name: Static lint gate
        run: pnpm lint
      # 分层诊断：包层与 Web 层各跑一次，失败时能直接看出是哪一层。
      # 根 pnpm test 现在是 test:packages && test:web 的串联，CI 不再调用它，
      # 否则 Web 层会被跑两遍（根入口一次 + 下面一次），既浪费时间也放大 flake 概率。
      - name: Test workspace (vitest)
        run: pnpm run test:packages
      - name: Typecheck apps/web (tsc -b)
        run: pnpm --filter @mozhou/web typecheck
      # Web 层构建必须先于 Web 层测试：dist-server/ 只由这一步产出（根 tsc -b 只引用
      # packages/*，apps/web 的 tsconfig 是 noEmit），而跨进程写锁等用例会 spawn 子进程
      # 直接 import dist-server/platform/writerLock.js。顺序颠倒时这些用例在全新检出上必挂。
      - name: Build apps/web (vite)
        run: pnpm --filter @mozhou/web build
      - name: Test apps/web (vitest)
        run: pnpm --filter @mozhou/web test
      # 文档门：术语单一权威 + 架构地图新鲜度 + 门清单的「在 CI」列一致性。
      # 都是「只许变好」的检查，失败即阻断合并。
      # 末两项 2026-10-10 补：`check-gates-ci-column.mjs` 校验 gates.md 的「在 CI」列与
      # workflows 实际一致（此前只校验三个硬编码门名，于是 duplication 那行写着「未接入」
      # 而它早已是 graph-gate.yml 的作业）；`check-doc-numbers.mjs` 只报不拦（exit 0），
      # 把文档里的裸规模数字暴露出来——两轮审计清的 15 处陈旧声称几乎全是这类数字。
      - name: Doc gates (glossary / architecture / gates / term-map / readmes / ci-column / doc-numbers)
        run: |
          pnpm run check:glossary
          pnpm run check:architecture
          pnpm run check:gates
          pnpm run check:term-map
          pnpm run check:readmes
          node scripts/check-gates-ci-column.mjs
          node scripts/check-doc-numbers.mjs
