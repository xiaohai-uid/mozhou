# Novel OS 主线 CI：构建、测试、类型检查、依赖漏洞门禁。
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  novel-os:
    name: build / test / security (packages/* + apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high
      - name: Build workspace (tsc -b)
        run: pnpm build
      - name: Test workspace (vitest)
        run: pnpm test
      - name: Typecheck apps/web (tsc -b)
        run: pnpm --filter @mozhou/web typecheck
      - name: Test apps/web (vitest)
        run: pnpm --filter @mozhou/web test
      - name: Build apps/web (vite)
        run: pnpm --filter @mozhou/web build
