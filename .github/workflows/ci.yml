name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  DATABASE_URL: postgres://mozhou:mozhou_dev@localhost:5433/mozhou
  AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
  CHAT_PROVIDER: mock
  DISTILL_PROVIDER: mock
  DECONSTRUCT_PROVIDER: mock
  DRAW_PROVIDER: mock
  SOURCE_PROVIDER: mock
  WEBSEARCH_PROVIDER: mock
  RANKINGS_PROVIDER: mock
  SYNC_PROVIDER: mock
  FANQIE_SEARCH_MOCK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  remote-preview-probe:
    name: protection-off probe
    runs-on: ubuntu-latest
    steps:
      - name: Verify direct deployment protection setting
        shell: bash
        run: |
          URL='https://vercel-protection-off-probe-iesqvkhou.vercel.app'
          STATUS=$(curl -L -sS -o /tmp/body.html -w '%{http_code}' "$URL/" || true)
          TITLE=$(grep -o -E '<title>[^<]+' /tmp/body.html | head -1 || true)
          echo "status=$STATUS title=$TITLE"
          head -c 800 /tmp/body.html || true
          echo
          test "$STATUS" = "200"
          grep -q 'VERCEL_PROTECTION_OFF_OK' /tmp/body.html
          ! grep -q 'Login – Vercel' /tmp/body.html

  workspace:
    if: false
    name: pnpm workspace / apps-web
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped-for-one-shot-probe

  gate:
    if: false
    name: typecheck / lint / unit+http / build
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped-for-one-shot-probe

  e2e:
    if: false
    name: playwright e2e
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped-for-one-shot-probe
