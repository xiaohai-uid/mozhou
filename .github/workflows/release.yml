name: Release & Packaging

on:
  workflow_dispatch:
    inputs:
      sourceCommit:
        description: 'Target commit SHA to release (must be an audited and verified commit on main/release branch)'
        required: true
        type: string
      releaseVersion:
        description: 'Release version tag (e.g. v0.3.0); must match package.json version'
        required: true
        type: string
        default: 'v0.3.0'
      draft:
        description: 'Create as draft release (default true for safety)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build-and-verify:
    name: Verify, smoke-test & package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.sourceCommit }}
          fetch-depth: 0

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          package-manager-cache: false

      # 发布前校验两个手工输入。没有这一步，就能从任意提交、用任意版本号发一个正式 Release，
      # 而 workflow_dispatch 的输入说明（:7、:11）却声称来源提交已审计、版本号必须匹配 package.json。
      # 校验放在构建之前，失败即停，不浪费后续安装与构建。
      - name: 校验发布来源与版本
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.inputs.sourceCommit }}
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          set -euo pipefail
          echo "sourceCommit   = ${SOURCE_COMMIT}"
          echo "releaseVersion = ${RELEASE_VERSION}"

          # 祖先判定需要 main/release 的分支引用。checkout 用 ref: sourceCommit 只拉取该提交，
          # 其完整历史由 checkout 的 fetch-depth: 0 保证；这里再显式取两个分支的引用。
          # release 分支惰性创建，可能不存在：逐个 fetch，缺哪个就少一个比较基准。
          git fetch --no-tags origin +main:refs/remotes/origin/main || true
          git fetch --no-tags origin +release:refs/remotes/origin/release || true

          # 提交对象必须真实存在（checkout 成功即已存在，这里给出显式的实际值以便排查）。
          if ! git cat-file -e "${SOURCE_COMMIT}^{commit}" 2>/dev/null; then
            echo "::error::sourceCommit 不是有效提交：${SOURCE_COMMIT}"
            exit 1
          fi

          on_audited_branch=0
          for branch in origin/main origin/release; do
            if git rev-parse --verify --quiet "${branch}" >/dev/null; then
              if git merge-base --is-ancestor "${SOURCE_COMMIT}" "${branch}"; then
                echo "OK: ${SOURCE_COMMIT} 是 ${branch} 的祖先"
                on_audited_branch=1
              else
                echo "不满足: ${SOURCE_COMMIT} 不是 ${branch} 的祖先"
              fi
            else
              echo "跳过: ${branch} 不存在（release 分支惰性创建）"
            fi
          done
          if [ "${on_audited_branch}" -ne 1 ]; then
            echo "::error::sourceCommit ${SOURCE_COMMIT} 既不是 origin/main 也不是 origin/release 的祖先，拒绝发布"
            exit 1
          fi

          # 版本匹配规则：去掉一个可选的前导 v 后，与 package.json 的 version 逐字相等。
          # 依据输入说明的例子 v0.3.0 与 package.json 现值 0.3.0：两者必须能对上，
          # 所以接受「带 v」与「不带 v」两种写法，但版本号本身必须完全一致。
          pkg_version="$(node -p "require('./package.json').version")"
          normalized="${RELEASE_VERSION#v}"
          if [ "${normalized}" != "${pkg_version}" ]; then
            echo "::error::releaseVersion ${RELEASE_VERSION} 与 package.json version ${pkg_version} 不一致（规范化后 ${normalized} != ${pkg_version}）"
            exit 1
          fi
          echo "OK: releaseVersion ${RELEASE_VERSION} 与 package.json version ${pkg_version} 一致"

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high

      - name: Build workspace
        run: pnpm build

      # 类型感知 lint 依赖 packages/*/dist 的 .d.ts（types 指向 dist）
      - name: Static lint gate
        run: pnpm lint

      - name: Run workspace tests
        run: pnpm test

      - name: Typecheck web and production server
        run: pnpm --filter @mozhou/web typecheck

      - name: Run web tests
        run: pnpm --filter @mozhou/web test

      - name: Build web and production server
        run: pnpm --filter @mozhou/web build

      # 发布路径真实模型自动化门：有凭据则跑真实模型端到端旅程，缺凭据则 BLOCKED 并阻断发布。
      # 刻意不放进默认 PR 门（ci.yml）——真实模型调用会产生费用，只在发布路径触发。
      # 依赖上一步产出的 apps/web/dist-server 与 pnpm build 产出的 packages/data-plane/dist。
      - name: Real-model release gate
        run: node scripts/release/real-model-gate.mjs
        env:
          MOZHOU_API_KEY: ${{ secrets.MOZHOU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOZHOU_API_BASE: ${{ secrets.MOZHOU_API_BASE }}
          MOZHOU_MODEL: ${{ secrets.MOZHOU_MODEL }}

      # 无论本门通过、失败还是 BLOCKED，都留存结构化证据（字段约定见 docs/gates.md）。
      - name: Upload real-model release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mozhou-real-model-release-evidence
          path: evidence/real-model-journey/**
          if-no-files-found: warn
          retention-days: 30

      - name: Build truthful release assets
        run: node scripts/build-release.mjs

      - name: Generate SPDX SBOM for tagged source
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/mozhou-sbom.spdx.json
          artifact-name: mozhou-release-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Smoke-test local runtime archive
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf release-artifacts/*-local-runtime.tar.gz -C "$tmp"
          runtime="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cd "$runtime"
          ONNXRUNTIME_NODE_INSTALL_CUDA=skip npx --yes pnpm@9.15.0 install --prod --frozen-lockfile
          MOZHOU_NO_OPEN=1 PORT=5188 node scripts/launcher.mjs >"$tmp/runtime.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5188/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$tmp/runtime.log"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:5188/api/membership | grep -q 'community'
          kill "$pid"
          wait "$pid" || true
          trap - EXIT

      - name: Smoke-test Docker release archive
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf release-artifacts/*-docker.tar.gz -C "$tmp"
          docker build --tag mozhou-release-smoke "$tmp/docker-bundle"

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release (Draft/Private)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: 墨舟 (Novel OS) ${{ github.event.inputs.releaseVersion }} · Technical Preview
          tag_name: ${{ github.event.inputs.releaseVersion }}
          target_commitish: ${{ github.event.inputs.sourceCommit }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## 墨舟 (Novel OS) 本地发行版

            本 Release 只发布已经在 CI 中安装并启动验证过的资产：
            - `*-local-runtime.tar.gz`：Node.js 22 本地运行时（跨平台，不冒充原生安装器）
            - `*-web-dist.tar.gz`：前端静态产物
            - `*-docker.tar.gz`：本机 Docker 发行包
            - `mozhou-sbom.spdx.json`：SPDX SBOM
            - `SHA256SUMS.txt`：完整性校验清单

            默认服务只绑定本机回环地址。云备份、付费许可证激活、未接线的数据源不会伪装成已实现。

            **支持范围（写入发布说明，依据 `docs/plans/2026-10-03-gitnexus-plan-mozhou-architecture-release.md:188`）**：写入权原语基于**会话本地**命名管道，因此**多 Windows 登录会话同时运行不在支持范围内**（跨会话互斥未实测，验证程序见 `docs/spikes/2026-10-08-writer-lock-cross-session-verification.md`）；**网络共享目录不能作为书稿目录**（未验证，先拒绝为可写书根）。
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/mozhou-sbom.spdx.json
            release-artifacts/SHA256SUMS.txt
