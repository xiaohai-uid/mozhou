name: Release & Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build-and-release:
    name: Verify, smoke-test & publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high

      - name: Build workspace
        run: pnpm build

      # 类型感知 lint 依赖 packages/*/dist 的 .d.ts（types 指向 dist），
      # 必须在 workspace 构建之后执行，否则工作区导入全部坍缩为 any 产生千级误报。
      - name: Static lint gate
        run: pnpm lint

      - name: Run workspace tests
        run: pnpm test

      - name: Typecheck web and production server
        run: pnpm --filter @mozhou/web typecheck

      - name: Run web tests
        run: pnpm --filter @mozhou/web test

      - name: Build web and production server
        run: pnpm --filter @mozhou/web build

      - name: Build truthful release assets
        run: node scripts/build-release.mjs

      - name: Generate SPDX SBOM for tagged source
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/mozhou-sbom.spdx.json
          artifact-name: mozhou-release-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Smoke-test local runtime archive
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf release-artifacts/*-local-runtime.tar.gz -C "$tmp"
          runtime="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cd "$runtime"
          ONNXRUNTIME_NODE_INSTALL_CUDA=skip npx --yes pnpm@9.15.0 install --prod --frozen-lockfile
          MOZHOU_NO_OPEN=1 PORT=5188 node scripts/launcher.mjs >"$tmp/runtime.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5188/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$tmp/runtime.log"
            exit 1
          fi
          node scripts/smoke-runtime-archive.mjs
          kill "$pid"
          wait "$pid" || true
          trap - EXIT

      - name: Smoke-test Docker release archive
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf release-artifacts/*-docker.tar.gz -C "$tmp"
          docker build --tag mozhou-release-smoke "$tmp/docker-bundle"

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: 墨舟 (Novel OS) ${{ github.ref_name }} · Technical Preview
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## 墨舟 (Novel OS) 本地发行版

            本 Release 只发布已经在 CI 中安装并启动验证过的资产：
            - `*-local-runtime.tar.gz`：Node.js 22 本地运行时（跨平台，不冒充原生安装器）
            - `*-web-dist.tar.gz`：前端静态产物
            - `*-docker.tar.gz`：本机 Docker 发行包
            - `mozhou-sbom.spdx.json`：SPDX SBOM
            - `SHA256SUMS.txt`：完整性校验清单

            默认服务只绑定本机回环地址。云备份、付费许可证激活、未接线的数据源不会伪装成已实现。
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/mozhou-sbom.spdx.json
            release-artifacts/SHA256SUMS.txt
