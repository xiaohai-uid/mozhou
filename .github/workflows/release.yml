name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签 (例如 v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build-and-release:
    name: Verify & Package Technical Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high

      - name: Build Packages (tsc -b)
        run: pnpm build

      - name: Run Test Suite (packages/*)
        run: pnpm test

      - name: Typecheck Web App
        run: pnpm --filter @mozhou/web typecheck

      - name: Test Web App (vitest)
        run: pnpm --filter @mozhou/web test

      - name: Build Web App (vite build)
        run: pnpm --filter @mozhou/web build

      - name: Generate Release Installation Packages
        run: node scripts/build-release.mjs

      - name: Generate SHA-256 manifest
        run: |
          find release-artifacts -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > release-artifacts/SHA256SUMS.txt
          test -s release-artifacts/SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Technical Preview with Packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: 墨舟 (Novel OS) ${{ steps.release_tag.outputs.tag }} Technical Preview
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## 🌊 墨舟 (Novel OS) Technical Preview

            这是面向早期测试者的长篇小说 AI 创作操作系统技术预览版，不宣称云同步、付费许可证或尚未接线的能力已经可用。

            ### 📦 独立安装包
            - 🪟 Windows 绿色免安装包
            - 🐧 Linux 独立运行包
            - 🍎 macOS 通用包
            - 🌐 Web 产物包
            - 🐳 Docker 本机预览包（默认仅绑定宿主 127.0.0.1）

            下载后请使用同一 Release 中的 `SHA256SUMS.txt` 校验文件完整性。
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
