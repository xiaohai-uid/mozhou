# 依赖环自动化门：在 CI 里拦住导入环回归，不再只靠本地手工跑。
#
# 背景：2026-10-07 发布审计发现 1 个依赖环（packages/data-plane/src/compaction.ts
# 与 local-data-plane.ts 互相 import）在 CI 全绿的同时存在于 HEAD。原因是
# .gitnexus/ 索引不入库（git ls-files .gitnexus = 0），CI 无法跑 pnpm graph:check；
# ci.yml 与 release.yml 也都没有图谱步骤。
#
# 本 workflow 用不依赖索引的静态导入环检测（scripts/check-import-cycles.mjs）
# 补上这个缺口：只读源码，不需要 .gitnexus、不需要联网下载额外工具。
# 覆盖 packages/* 与 apps/web 的源码，含跨包 @mozhou/* 依赖。
#
# 2026-10-10 追加 duplication job：把「重复代码检查」从假绿空转变成真的门。
# .jscpd.json 此前没传扫描路径、且用了 jscpd 3.5.10 不认的 formats 键（已修），
# 即便能实扫也永远 exit 0。现在配置里加了 threshold，超限即非 0 退出。它与环检测
# 同属「不需索引、只读源码」的静态门，故合并在本 workflow，不再另起一个文件。
name: graph-gate

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  import-cycles:
    name: static import cycle check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.0
      # 检测脚本用 devDependency 里的 typescript 解析导入（不新增依赖），
      # 所以必须先装依赖再跑。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 退出码：0 无环；1 发现依赖环（阻断合并）；2 用法错误。
      - name: Static import cycle gate
        run: node scripts/check-import-cycles.mjs

  # 重复度阈值门。独立成 job 而不是 import-cycles 的一个 step：jscpd 由
  # `pnpm duplication` 用 `npx --yes jscpd@3.5.10` 现场拉取（不新增依赖），
  # 因此本 job 不需要 `pnpm install`，单独跑更快、状态也更清楚。
  duplication:
    name: duplication threshold
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.0
      # 阈值依据（2026-10-10 本机 `pnpm duplication` 实测）：总体重复行 11642/73146
      # = 15.92%（TypeScript 3.05%、JavaScript 48.97%，共 149 处克隆）。.jscpd.json 的
      # threshold 取 17 ≈ 实测 +1.1 个百分点：只拦「重复度继续恶化」，不要求把现有
      # 149 处克隆都清掉（那些是独立的技术债，不归本门）。
      # 退出码：0 未超阈值；非 0 超阈值（阻断合并）。
      - name: Duplication threshold gate
        run: pnpm duplication
