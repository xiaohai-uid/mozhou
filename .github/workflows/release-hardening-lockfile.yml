name: release-hardening-lockfile

on:
  push:
    branches: [release-hardening-2026-09-03]
    paths:
      - '.github/workflows/release-hardening-lockfile.yml'

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-hardening-2026-09-03
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Build workspace
        run: pnpm build
      - name: Test workspace
        run: pnpm test
      - name: Typecheck web
        run: pnpm --filter @mozhou/web typecheck
      - name: Test web
        run: pnpm --filter @mozhou/web test
      - name: Build web
        run: pnpm --filter @mozhou/web build
      - name: Commit verified lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(security): refresh audited lockfile"
          git push origin HEAD:release-hardening-2026-09-03
