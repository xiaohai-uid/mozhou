# 性能冒烟（K6）：夜间与手动触发，独立于 longform-nightly。
#
# 为什么独立成一个 workflow 而不是并进 longform-nightly：
#   1. longform 需要真实模型密钥（MOZHOU_API_KEY 等），缺了就整条红；
#      本冒烟零凭据、零上游费用，不该被密钥缺失连坐；
#   2. longform 一次 120 分钟，本冒烟约 3 分钟——失败反馈周期差 40 倍，
#      合在一起会让「性能回归了」这个信号埋在长任务里出不来；
#   3. 两者失败的处置动作完全不同（一个查模型链路，一个查服务性能），
#      通知到人时应该是两个入口。
#
# 刻意不进 PR 门（ci.yml）：冒烟要先构建 dist-server 再压 30 秒，
# 每次 PR 都付这个成本不划算。夜间跑足以在合入后的第二天早上暴露回归。
name: perf-smoke-nightly

on:
  schedule:
    # UTC 18:30 = Asia/Shanghai 02:30，错开 longform 的 02:00 半小时，
    # 避免两个 job 同时抢 runner 与彼此的服务端口。
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

concurrency:
  group: perf-smoke-nightly
  cancel-in-progress: false

jobs:
  smoke:
    name: k6 smoke (10 VU / 30s)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # k6 官方 action，版本钉死：压测工具的版本漂移会让「昨天的 p95」
      # 与「今天的 p95」不可比，钉版是基准可信的前提。
      # 用 tag 而非 SHA：本仓其他 action 走 SHA 钉版是既有约定，但该 action 的
      # tag 列表（v1.2.2 为最新）已实测核对，且本 nightly 非 PR 门、触发面小，
      # tag 漂移风险可接受；若日后要更严格，再按 SHA 换。
      - name: Install k6
        uses: grafana/setup-k6-action@v1.2.2
        with:
          k6-version: v2.3.0

      - name: Build workspace (tsc -b)
        run: pnpm build
      - name: Build web and production server
        run: pnpm --filter @mozhou/web build

      # run-smoke.mjs 的退出码语义直接映射到 CI：
      #   0 = 阈值全绿；1 = 阈值红（性能回归）；2 = 环境阻塞（构建缺失/服务起不来）。
      # 后两者都让 job 红，但日志前缀 BLOCKED / FAILED 区分了「没测成」与「测了没过」，
      # 值班的人不用翻日志就能判断该找构建还是找性能。
      - name: Run k6 smoke
        run: pnpm perf:smoke
