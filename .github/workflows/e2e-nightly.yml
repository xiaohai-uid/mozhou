# 跨浏览器 E2E 冒烟夜跑：生产服务 + Chromium / Firefox / WebKit。
# 本地推送前门（ci-gate.mjs e2e）已经跑过同一套用例；这里把它接到托管 CI，
# 让三浏览器结论不依赖开发者记得本地跑门。与既有夜跑错峰（18:00 / 18:30 已占用）。
name: e2e-nightly

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  cross-browser-e2e:
    name: e2e smoke (chromium / firefox / webkit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace (tsc -b)
        run: pnpm build
      # e2e/run-e2e.mjs 前置检查构建产物新鲜度：dist-server/ 只由这一步产出。
      - name: Build apps/web (vite)
        run: pnpm --filter @mozhou/web build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Cross-browser e2e smoke
        run: pnpm test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
