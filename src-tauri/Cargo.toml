[package]
name = "mozhou-desktop"
version = "0.2.0"
description = "MoZhou Novel OS 2.0 Desktop"
authors = ["MoZhou Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 安装密钥（MOZHOU_SECRET_KEY）必须来自 CSPRNG；不用墙钟种子/LCG 自造随机。
# 该 crate 已作为传递依赖存在于 Cargo.lock（0.3.4），此处只是把它变成直接依赖。
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security"
] }
