# 墨舟 (Novel OS) 分发编排。
# 默认仅启动 local-first Novel OS。历史 Postgres/one-api/Crawl4AI 栈必须显式启用：
#   docker compose --profile legacy-infra up -d
services:
  mozhou:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mozhou-novel-os
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOZHOU_PORT:-5173}:5173"
    environment:
      - NODE_ENV=production
      - ONNXRUNTIME_NODE_INSTALL_CUDA=skip
      - PORT=5173
      # 容器内需监听全部接口以供宿主端口转发；宿主映射仍锁定 127.0.0.1。
      - HOST=0.0.0.0
      # 数据根必须落在挂载卷上：写镜像层时 `docker compose down`、换镜像或重建
      # 容器都会连同全部书稿一起销毁，且不报任何错。
      - MOZHOU_DATA_ROOT=/data
      # 凭据加密主密钥。缺失时服务启动即失败——不再回退到源码可见的常量，
      # 否则 BYOK 密钥实际等于明文落盘。生成：openssl rand -base64 48
      - MOZHOU_SECRET_KEY=${MOZHOU_SECRET_KEY:?MOZHOU_SECRET_KEY is required - generate one with openssl rand -base64 48}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOZHOU_API_KEY=${MOZHOU_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - mozhou-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 以下均为旧 Web/SaaS 栈兼容设施，不属于 v0.1 local-first 默认发行攻击面。
  crawl4ai:
    profiles: ["legacy-infra"]
    image: unclecode/crawl4ai:latest
    container_name: mozhou-crawl4ai
    restart: unless-stopped
    expose:
      - "11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:?legacy-infra requires CRAWL4AI_API_TOKEN}

  postgres:
    profiles: ["legacy-infra"]
    image: pgvector/pgvector:pg16
    container_name: mozhou-postgres
    environment:
      POSTGRES_USER: mozhou
      POSTGRES_PASSWORD: ${MOZHOU_POSTGRES_PASSWORD:?legacy-infra requires MOZHOU_POSTGRES_PASSWORD}
      POSTGRES_DB: mozhou
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mozhou"]
      interval: 5s
      timeout: 3s
      retries: 10

  one-api:
    profiles: ["legacy-infra"]
    image: justsong/one-api@sha256:a55fb5181854aa0823cc04797ee875dfc5a953c0deb5e7e7ec39a8148e70cbc3
    container_name: mozhou-one-api
    environment:
      TZ: Asia/Shanghai
      SQL_DSN: ""
      SESSION_SECRET: ${ONEAPI_SESSION_SECRET:?legacy-infra requires ONEAPI_SESSION_SECRET}
    expose:
      - "3000"
    volumes:
      - oneapi-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  app:
    profiles: ["legacy-infra"]
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: mozhou-legacy-app
    environment:
      DATABASE_URL: postgres://mozhou:${MOZHOU_POSTGRES_PASSWORD}@postgres:5432/mozhou
      AUTH_SECRET: ${AUTH_SECRET:?legacy-infra requires AUTH_SECRET}
      ONEAPI_BASE_URL: ${ONEAPI_BASE_URL:-http://one-api:3000}
      ONEAPI_TOKEN: ${ONEAPI_TOKEN:?legacy-infra requires ONEAPI_TOKEN}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      one-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # 书稿与账户数据。命名卷独立于容器生命周期，`docker compose down` 不会删除它
  # （仅 `down -v` 会）；升级镜像后原数据仍在。
  mozhou-data:
  pgdata:
  oneapi-data:
