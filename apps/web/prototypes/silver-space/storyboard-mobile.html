<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候选 · 分镜编辑（390 手机）</title>
<style>
/* ============================================================
   MoZhou 银白创作空间 · 设计候选设计系统（ui-ux-review U01–U09）
   方向：银白建筑空间（前中后景/接触阴影/统一左上主光）+ 实体金属藏卡
   纪律：材质不编码语义；正文近实心；动效仅操作反馈 120–180ms；
   reduced-motion 静态替代；无循环扫光/入场位移/假分数。
   ============================================================ */

:root {
  /* 工程起点 token（brief.visual.tokens 延续 + 候选推导） */
  --ss-canvas: #e6ecf2;
  --ss-panel: #f1f4f7;
  --ss-panel-raised: #f7fafd;
  --ss-text: #202a35;
  --ss-muted: #526170;
  --ss-faint: #7e8ea0;
  --ss-line: rgba(32, 42, 53, 0.13);
  --ss-line-strong: rgba(32, 42, 53, 0.22);
  --ss-silver-low: #9aa8b8;
  --ss-silver-mid: #c9d4e0;
  --ss-silver-high: #f7fafd;
  --ss-gold-low: #ac803f;
  --ss-gold-mid: #d9b877;
  --ss-gold-high: #f5e5c9;
  --ss-focus: #2f6fed;
  --ss-ok: #2e7d54;
  --ss-danger: #b3423a;
  --ss-warn: #a06a1f;

  --ss-radius-panel: 14px;
  --ss-radius-card: 16px;
  --ss-radius-chip: 999px;

  --ss-sans: 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
  --ss-serif: 'Songti SC', 'Noto Serif SC', SimSun, serif;
  --ss-mono: 'Cascadia Code', Consolas, ui-monospace, monospace;

  /* 字阶（U07）：UI 14–16 / 正文 17–19 / 状态 12–13 / 数字等宽 */
  --ss-fs-ui: 14.5px;
  --ss-fs-status: 12.5px;
  --ss-fs-prose: 18px;
  --ss-lh-prose: 1.9;

  --ss-dur: 150ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: var(--ss-sans);
  font-size: var(--ss-fs-ui);
  color: var(--ss-text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ============ 银白建筑空间（原创 SVG 场景：前/中/后景 + 统一光源） ============
   场景只在页边与对象之间显露；正文容器近实心，下方不透纹理。 */

.ss-stage { position: relative; min-height: 100vh; }

.ss-space {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.ss-space svg { width: 100%; height: 100%; display: block; }

.ss-content { position: relative; z-index: 1; }

/* ============ 面板：浅浮起 + 窄切边高光（无厚浮雕） ============ */

.ss-panel {
  background: linear-gradient(178deg, var(--ss-panel-raised), var(--ss-panel) 88%);
  border: 1px solid var(--ss-line);
  border-radius: var(--ss-radius-panel);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.85),
    0 1px 2px rgba(32, 42, 53, 0.05),
    0 10px 30px rgba(82, 97, 112, 0.1);
}

.ss-panel-pad { padding: 16px 18px; }
.ss-panel-title { display: flex; align-items: baseline; gap: 12px; }
.ss-panel-title b { font-size: 15px; letter-spacing: 0.02em; }

.ss-note { color: var(--ss-muted); font-size: var(--ss-fs-status); }
.ss-mono { font-family: var(--ss-mono); font-size: 11.5px; }

/* ============ 顶部导航（U01：作品/写作/分镜/素材 四域 + 工具入口） ============ */

.ss-topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 24px;
  background: rgba(247, 250, 253, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--ss-line);
}
.ss-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
.ss-nav { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.ss-nav a {
  display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px;
  border-radius: 10px; color: var(--ss-muted); text-decoration: none;
  font-size: var(--ss-fs-ui); white-space: nowrap; flex: none;
  transition: background var(--ss-dur) ease, color var(--ss-dur) ease;
}
.ss-nav a:hover { background: rgba(32, 42, 53, 0.06); color: var(--ss-text); }
.ss-nav a[aria-current='page'] {
  background: linear-gradient(165deg, var(--ss-silver-high), var(--ss-silver-mid));
  color: var(--ss-text); font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(32,42,53,.12);
}
.ss-nav-group-label {
  align-self: center; padding: 0 4px 0 12px;
  font-size: 11px; color: var(--ss-faint); letter-spacing: .12em; white-space: nowrap;
}

/* ============ 按钮/输入（低装饰；金属重点留给作品卡） ============ */

.ss-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 0 18px; border-radius: 11px;
  border: 1px solid var(--ss-line-strong);
  background: linear-gradient(172deg, var(--ss-silver-high), var(--ss-silver-mid));
  color: var(--ss-text); font-size: var(--ss-fs-ui); font-weight: 600; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(32,42,53,.12);
  transition: box-shadow var(--ss-dur) ease, transform var(--ss-dur) ease;
}
.ss-btn:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 3px 10px rgba(32,42,53,.16); }
.ss-btn:active { transform: translateY(1px); }
.ss-btn.primary {
  background: linear-gradient(172deg, var(--ss-silver-high), var(--ss-silver-low));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 8px rgba(32,42,53,.2);
}
.ss-btn.gold-soft {
  background: linear-gradient(172deg, var(--ss-gold-high), var(--ss-gold-mid));
  border-color: rgba(172,128,63,.35); color: #4c3a17;
}
.ss-btn.ghost { background: rgba(255,255,255,.6); box-shadow: none; font-weight: 500; }
.ss-btn[disabled] {
  cursor: not-allowed; background: linear-gradient(172deg, #eef1f5, #dde3ea);
  color: rgba(32,42,53,.38); box-shadow: none; border-color: var(--ss-line);
}

.ss-input, .ss-select {
  min-height: 42px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--ss-line-strong); background: rgba(255,255,255,.8);
  color: var(--ss-text); font-size: var(--ss-fs-ui); font-family: var(--ss-sans);
}
.ss-textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; resize: vertical;
  border: 1px solid var(--ss-line-strong); background: rgba(255,255,255,.85);
  color: var(--ss-text); font-size: var(--ss-fs-ui); font-family: var(--ss-sans); line-height: 1.7;
}

:where(a, button, [tabindex], input, select, textarea):focus-visible {
  outline: 2px solid var(--ss-focus); outline-offset: 2px; border-radius: 10px;
}

/* ============ 状态徽章（U09：状态用文字+图标，不靠材质） ============ */

.ss-badge {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 24px; padding: 2px 11px; border-radius: var(--ss-radius-chip);
  border: 1px solid var(--ss-line); background: rgba(255,255,255,.66);
  font-size: var(--ss-fs-status); font-weight: 600; color: var(--ss-muted);
  white-space: nowrap;
}
.ss-badge.ok { color: var(--ss-ok); border-color: rgba(46,125,84,.35); }
.ss-badge.warn { color: var(--ss-warn); border-color: rgba(160,106,31,.35); }
.ss-badge.stale { color: var(--ss-danger); border-color: rgba(179,66,58,.32); }

/* ============ 正文阅读面（近实心；17–19px 衬线；1.75–1.95 行距） ============ */

.ss-prose-surface {
  background: #fdfefe;
  border: 1px solid var(--ss-line);
  border-radius: 12px;
  padding: 30px 38px 36px;
  box-shadow: 0 1px 2px rgba(32,42,53,.04);
}
.ss-prose {
  font-family: var(--ss-serif);
  font-size: var(--ss-fs-prose);
  line-height: var(--ss-lh-prose);
  color: #1d2630;
  max-width: 40em; /* 中文行长 28–40 字 */
}
.ss-prose p { margin: 0 0 .45em; text-indent: 2em; }

/* ============ 金属卡（U08：同材质凹凸徽记/窄切边/宽环境反射/厚度） ============ */

.ss-metal-card {
  position: relative; width: 244px; aspect-ratio: 244/340;
  border-radius: 18px; border: 0; padding: 0; text-align: left; cursor: pointer;
  background: transparent; -webkit-tap-highlight-color: transparent;
  transition: transform var(--ss-dur) ease, box-shadow var(--ss-dur) ease;
}
.ss-metal-face {
  position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.9),      /* 顶切边高光 */
    inset 1.5px 0 0 rgba(255,255,255,.45),
    inset -1.5px 0 0 rgba(32,42,53,.18),
    inset 0 -3px 0 rgba(32,42,53,.24),          /* 底缘厚度 */
    0 2px 4px rgba(32,42,53,.14),
    0 18px 34px rgba(32,42,53,.16);             /* 接触投影（主光左上） */
}
/* 宽环境反射：静态、柔和、非均匀（主光左上 → 右下衰减） */
.ss-metal-face::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
  background:
    radial-gradient(130% 90% at 12% 0%, rgba(255,255,255,.42) 0%, rgba(255,255,255,.08) 34%, rgba(255,255,255,0) 60%),
    linear-gradient(116deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.2) 52%, rgba(32,42,53,.06) 68%, rgba(255,255,255,0) 80%);
}
.ss-metal-brushed {
  position: absolute; inset: 0; opacity: .42; mix-blend-mode: overlay; pointer-events: none;
}

/* 徽记压印：同材质凹凸（暗影在下、高光在上沿），非贴片 */
.ss-emblem-emboss { filter: drop-shadow(0 1px .5px rgba(32,42,53,.32)) drop-shadow(0 -1px .5px rgba(255,255,255,.65)); }

.ss-card-back-silver .ss-metal-face {
  background: linear-gradient(152deg, var(--ss-silver-high) 0%, var(--ss-silver-mid) 40%, var(--ss-silver-low) 66%, #b6c2d0 100%);
}
.ss-card-back-gold .ss-metal-face {
  /* 金：浅香槟为主，暗部只收窄在右下缘，减少黄褐大面积暗部 */
  background: linear-gradient(152deg, #faf1dd 0%, var(--ss-gold-high) 34%, var(--ss-gold-mid) 62%, #cfa763 86%, #b98f4d 100%);
}

.ss-relief { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.ss-relief svg.ss-emblem { width: 44%; height: auto; }
.ss-relief .ss-relief-word {
  font-size: 10.5px; letter-spacing: .4em; text-indent: .4em;
  color: rgba(32,42,53,.38); text-shadow: 0 1px 0 rgba(255,255,255,.55);
}
.ss-card-back-gold .ss-relief .ss-relief-word { color: rgba(90,68,28,.42); }

/* 卡面（正面）：窄金属框 + 图区主体 + 独立内凹铭牌 */
.ss-card-front .ss-metal-face { background: linear-gradient(165deg, var(--ss-silver-high), var(--ss-silver-mid) 90%); }
.ss-card-front.gold .ss-metal-face { background: linear-gradient(165deg, #faf1dd, var(--ss-gold-mid) 90%); }
.ss-card-front-frame {
  position: absolute; inset: 8px; border-radius: 12px;
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid rgba(32,42,53,.2);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 1px 0 rgba(255,255,255,.5);
}
.ss-card-art { position: relative; flex: 1; min-height: 0; background: #e3e9f0; }
.ss-card-art svg { width: 100%; height: 100%; display: block; }
.ss-no-cover {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--ss-muted);
  background: repeating-linear-gradient(45deg, rgba(154,168,184,.13) 0 10px, rgba(154,168,184,.045) 10px 20px);
}
.ss-no-cover b { font-size: 12.5px; letter-spacing: .08em; }
.ss-no-cover span { font-size: 10.5px; }
.ss-nameplate {
  padding: 9px 12px 10px;
  background: linear-gradient(180deg, rgba(32,42,53,.09), rgba(32,42,53,.02));
  box-shadow: inset 0 2px 5px rgba(32,42,53,.18), inset 0 -1px 0 rgba(255,255,255,.6);
}
.ss-nameplate .ss-title {
  font-family: var(--ss-serif); font-size: 15px; font-weight: 700; letter-spacing: .04em;
  color: var(--ss-text); text-shadow: 0 1px 0 rgba(255,255,255,.5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ss-nameplate .ss-meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; font-size: 11px; color: var(--ss-muted); }

.ss-metal-card:hover { transform: translateY(-4px); }
.ss-metal-card.selected { transform: translateY(-6px) scale(1.02); }
.ss-metal-card.selected .ss-metal-face {
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.9), inset 1.5px 0 0 rgba(255,255,255,.45),
    inset -1.5px 0 0 rgba(32,42,53,.18), inset 0 -3px 0 rgba(32,42,53,.24),
    0 0 0 2.5px var(--ss-focus), 0 6px 12px rgba(32,42,53,.18), 0 22px 44px rgba(32,42,53,.2);
}
.ss-metal-card.disabled { cursor: not-allowed; filter: saturate(.25) contrast(.92); opacity: .72; }
.ss-metal-card.disabled:hover { transform: none; }

/* ============ 通用交互态 ============ */

@media (prefers-reduced-motion: reduce) {
  .ss-metal-card, .ss-btn, .ss-nav a { transition: none; }
  .ss-metal-card:hover, .ss-metal-card.selected { transform: none; }
  .ss-btn:active { transform: none; }
}
@media (forced-colors: active) {
  .ss-metal-face, .ss-panel { border: 1px solid CanvasText; }
}

/* 示例数据标注（不得冒充真实生成） */
.ss-sample-tag {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 20px; padding: 1px 9px; border-radius: var(--ss-radius-chip);
  border: 1px dashed rgba(160,106,31,.5); color: var(--ss-warn);
  font-size: 11px; background: rgba(245,229,201,.25);
}

</style>
<style>
  /* 390 全屏任务页（U05）：固定顶栏（返回/作品章节/保存状态）+ 单镜编辑 + 底部安全区工具栏 */
  body { background: var(--ss-canvas); }
  .m-app { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

  .m-top {
    position: sticky; top: 0; z-index: 5;
    display: grid; grid-template-columns: 44px 1fr 84px; align-items: center; gap: 8px;
    padding: 10px 12px; background: rgba(247,250,253,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--ss-line);
  }
  .m-back { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--ss-line); background: rgba(255,255,255,.7); font-size: 17px; cursor: pointer; }
  .m-top .mid { text-align: center; min-width: 0; }
  .m-top .mid b { display: block; font-size: 14px; font-family: var(--ss-serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-top .mid span { font-size: 11.5px; color: var(--ss-muted); }
  .m-top .ss-badge { justify-self: end; }

  .m-body { flex: 1; padding: 12px 14px 120px; display: grid; gap: 12px; align-content: start; }

  .m-pos { display: flex; align-items: center; gap: 10px; }
  .m-pos .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(154,168,184,.35); overflow: hidden; }
  .m-pos .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ss-silver-mid), var(--ss-silver-low)); }
  .m-pos .num { font-family: var(--ss-mono); font-size: 12px; color: var(--ss-muted); }

  .m-visual {
    aspect-ratio: 9/12; border-radius: 14px; border: 1px solid var(--ss-line-strong);
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: repeating-linear-gradient(45deg, rgba(154,168,184,.12) 0 10px, rgba(154,168,184,.04) 10px 20px), #e6ecf2;
    color: var(--ss-muted); display: grid; place-content: center; gap: 6px;
  }

  .m-field { display: grid; gap: 5px; }
  .m-field > label { font-size: 12px; color: var(--ss-muted); letter-spacing: .04em; }
  .m-field .ss-input, .m-field .ss-textarea { width: 100%; }
  .m-dialogue { border-left: 3px solid var(--ss-silver-mid); background: rgba(255,255,255,.66); border-radius: 0 10px 10px 0; padding: 8px 12px; font-family: var(--ss-serif); font-size: 15px; }
  .m-dialogue .who { font-size: 11.5px; font-weight: 700; color: #4c3a17; margin-right: 6px; font-family: var(--ss-sans); }

  .m-adv-toggle { width: 100%; justify-content: space-between; }
  .m-adv { display: grid; gap: 12px; border-top: 1px dashed var(--ss-line); padding-top: 12px; margin-top: 2px; }
  .m-adv[hidden] { display: none; }

  /* 底部安全区工具栏（U05：保存与镜头切换常在，无需回到顶部） */
  .m-toolbar {
    position: sticky; bottom: 0; z-index: 5;
    display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: rgba(247,250,253,.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--ss-line);
  }
  .m-toolbar .ss-btn { min-height: 46px; padding: 0 8px; font-size: 13.5px; }
</style>
</head>
<body>
<div class="m-app">
  <!-- 固定顶栏：返回 / 作品·章节 / 保存状态 -->
  <header class="m-top">
    <button class="m-back" aria-label="返回作品">‹</button>
    <div class="mid"><b>雾港失真 · 灯塔夜谈</b><span id="mHeadMeta">第 3 章 · 30 镜 · 约…s</span></div>
    <span class="ss-badge warn" id="mBadge">● 未保存</span>
  </header>

  <main class="m-body">
    <div class="m-pos" aria-label="镜头位置">
      <span class="num" id="mNo">07 / 30</span>
      <div class="bar"><i id="mBar" style="width:23%"></i></div>
      <span class="num">S2</span>
    </div>

    <!-- 单镜编辑：画面占位 + 动作摘要 + 主要对白 + 时长 -->
    <div class="m-visual"><b style="font-size:13px;letter-spacing:.06em">无画面</b><span style="font-size:11px">点按选择配图（不假造）</span></div>

    <div class="m-field"><label>动作摘要</label>
      <input class="ss-input" id="mVisual" value="生锈铜钥匙被推过木桌，灯下拖出一道反光" data-testid="m-visual">
    </div>
    <div class="m-field"><label>主要对白</label>
      <div id="mDialogue"></div>
    </div>
    <div class="m-field"><label>估计时长（秒）</label>
      <input class="ss-input" style="max-width:110px;font-family:var(--ss-mono)" id="mDur" inputmode="decimal" value="6.5">
    </div>

    <!-- 高级字段折叠 -->
    <button class="ss-btn ghost m-adv-toggle" id="mAdvBtn" aria-expanded="false" data-testid="m-adv-toggle">
      <b style="font-size:13.5px">高级字段</b><span class="ss-note">旁白/音效/提示词/改编说明 ▾</span>
    </button>
    <div class="m-adv" id="mAdv" hidden>
      <div class="m-field"><label>旁白</label><input class="ss-input" id="mNarr" value="程蔚在等那句一定会来的话。"></div>
      <div class="m-field"><label>音效</label><input class="ss-input" value="钥匙与木纹摩擦；远处雾笛"></div>
      <div class="m-field"><label>图像提示词</label>
        <textarea class="ss-textarea" rows="2">close-up, rusted brass key on wooden desk, warm lamp</textarea>
      </div>
      <div class="m-field"><label>原文对照（只读）</label>
        <div class="m-dialogue" style="font-size:13.5px">「灯塔不是用来照路的。」老人终于开口。</div>
      </div>
      <div class="m-field"><label>改编说明</label><input class="ss-input" value="台词前置制造张力"></div>
    </div>

    <p class="ss-note" style="margin:2px 0 0">示例数据 · 非真实生成。编辑即时保留在本地；保存走显式动作。</p>
  </main>

  <!-- 底部安全区工具栏：上一镜 / 保存 / 下一镜 -->
  <nav class="m-toolbar" aria-label="镜头操作">
    <button class="ss-btn ghost" id="mPrev">‹ 上一镜</button>
    <button class="ss-btn primary" id="mSave" data-testid="m-save">保存</button>
    <button class="ss-btn ghost" id="mNext">下一镜 ›</button>
  </nav>
</div>
<script>
  /* 示例数据：30 镜 / 3 场景（与桌面候选同一套，标注示例） */
  const SCENE_NAMES = { S1: 'S1 · 灯塔脚下', S2: 'S2 · 灯塔值班室', S3: 'S3 · 雾线之外' };
  const SCENE_OF = (n) => (n <= 9 ? 'S1' : n <= 22 ? 'S2' : 'S3');
  const GISTS = ['浓雾漫上礁石','灯塔黑影立于雾线','程蔚按下录音键','卵石随退潮滚动','月亮在云后移出','钥匙推过木桌','灯下反光细长','墙上双影晃动','磁带计数器 0199','老人望向熄灯','玻璃罩的划痕','程蔚记录本特写','雾笛远响','窗外涨潮线','铜钥匙归位','海面泛银光','鸥鸟掠过雾隙','退潮线后退','旧照片翻面','灯塔底座苔痕','两人对坐无言','茶杯热气','门轴吱呀','台阶向下','手电光柱入雾','塔门铜锁','潮声渐强','转身回望','灯塔全貌拉远','雾合拢，黑场'];
  const DUR = (n) => [4, 5.5, 6.5, 3.5, 8][n % 5];
  let cur = 7;
  const noEl = document.getElementById('mNo'), barEl = document.getElementById('mBar');
  const visEl = document.getElementById('mVisual'), durEl = document.getElementById('mDur');
  const badge = document.getElementById('mBadge');
  const total = GISTS.reduce((a, _, i) => a + DUR(i + 1), 0);
  document.getElementById('mHeadMeta').textContent = '第 3 章 · 30 镜 · 约' + Math.round(total) + 's';
  function render() {
    noEl.textContent = `${String(cur).padStart(2, '0')} / 30`;
    barEl.style.width = (cur / 30 * 100).toFixed(1) + '%';
    visEl.value = GISTS[cur - 1] + '；可拍摄动作与光线交代';
    durEl.value = DUR(cur);
    // 与桌面候选同一规则：n%3===0 有老人台词，否则本镜无对白（旁白承载）
    document.getElementById('mDialogue').innerHTML = cur % 3 === 0
      ? '<div class="m-dialogue"><span class="who">守塔老人</span>「灯塔不是用来照路的，是用来让人确认，自己还没有漂出太远。」</div>'
      : '<div class="ss-note" style="padding:6px 0">本镜无对白（旁白承载）</div>';
  }
  function touch() { badge.className = 'ss-badge warn'; badge.textContent = '● 未保存'; }
  visEl.addEventListener('input', touch);
  durEl.addEventListener('input', touch);
  document.getElementById('mPrev').addEventListener('click', () => { cur = Math.max(1, cur - 1); render(); });
  document.getElementById('mNext').addEventListener('click', () => { cur = Math.min(30, cur + 1); render(); });
  document.getElementById('mSave').addEventListener('click', () => {
    badge.className = 'ss-badge ok'; badge.textContent = '已保存 r12';
  });
  document.getElementById('mAdvBtn').addEventListener('click', (e) => {
    const open = document.getElementById('mAdv').hidden;
    document.getElementById('mAdv').hidden = !open;
    e.currentTarget.setAttribute('aria-expanded', String(open));
  });
  render();
  document.title += ' · ' + SCENE_NAMES[SCENE_OF(cur)];
</script>
</body>
</html>
