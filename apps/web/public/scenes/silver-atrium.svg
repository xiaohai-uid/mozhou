<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- 墨舟 · 银白建筑空间（原创）：后景墙板 → 中景梁柱/悬板 → 前景台沿；统一左上主光 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FAFD"/>
      <stop offset="0.55" stop-color="#E4EBF3"/>
      <stop offset="1" stop-color="#D2DCE8"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFF4F9"/>
      <stop offset="1" stop-color="#DCE4EE"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9FCFE"/>
      <stop offset="0.5" stop-color="#E0E8F0"/>
      <stop offset="1" stop-color="#B9C6D4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0CCDA"/>
      <stop offset="0.4" stop-color="#D5DEE9"/>
      <stop offset="1" stop-color="#AEBAC9"/>
    </linearGradient>
    <linearGradient id="beamLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="keyLight" cx="0.16" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 后景：墙板与竖缝 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect y="110" width="1920" height="560" fill="url(#wallL)"/>
  <g stroke="#C3CEDA" stroke-width="2" opacity="0.62">
    <line x1="200" y1="130" x2="200" y2="656"/><line x1="440" y1="130" x2="440" y2="656"/>
    <line x1="680" y1="130" x2="680" y2="656"/><line x1="920" y1="130" x2="920" y2="656"/>
    <line x1="1160" y1="130" x2="1160" y2="656"/><line x1="1400" y1="130" x2="1400" y2="656"/>
    <line x1="1640" y1="130" x2="1640" y2="656"/>
  </g>
  <rect y="120" width="1920" height="5" fill="#F9FCFE" opacity="0.85"/>

  <!-- 中景：两道斜光带（左上主光方向） -->
  <polygon points="180,0 460,0 1080,1080 700,1080" fill="url(#beamLight)" opacity="0.5"/>
  <polygon points="1320,0 1470,0 1010,1080 880,1080" fill="url(#beamLight)" opacity="0.3"/>

  <!-- 中景：左右悬空金属厚板（带厚度暗缘） -->
  <path d="M -80 290 L 360 352 L 360 428 L -80 372 Z" fill="url(#slab)"/>
  <path d="M -80 372 L 360 428 L 360 444 L -80 390 Z" fill="#97A7BA" opacity="0.85"/>
  <path d="M 2000 240 L 1540 322 L 1540 398 L 2000 322 Z" fill="url(#slab)"/>
  <path d="M 2000 322 L 1540 398 L 1540 414 L 2000 338 Z" fill="#97A7BA" opacity="0.85"/>

  <!-- 中景：右侧一根圆柱（前中景层次） -->
  <rect x="1690" y="120" width="86" height="560" rx="10" fill="url(#slab)" opacity="0.95"/>
  <rect x="1690" y="120" width="18" height="560" fill="#FFFFFF" opacity="0.55"/>

  <!-- 地面 + 地平线亮缘 -->
  <rect y="656" width="1920" height="424" fill="url(#floor)"/>
  <rect y="652" width="1920" height="6" fill="#F9FCFE" opacity="0.92"/>
  <g stroke="#A9B7C6" stroke-width="2" opacity="0.5">
    <line x1="90" y1="1080" x2="690" y2="658"/><line x1="470" y1="1080" x2="796" y2="658"/>
    <line x1="960" y1="1080" x2="960" y2="658"/><line x1="1450" y1="1080" x2="1124" y2="658"/>
    <line x1="1830" y1="1080" x2="1230" y2="658"/>
    <line x1="0" y1="812" x2="1920" y2="812"/><line x1="0" y1="936" x2="1920" y2="936"/>
  </g>
  <rect x="280" y="660" width="230" height="300" fill="url(#refl)" opacity="0.55"/>
  <rect x="890" y="660" width="150" height="215" fill="url(#refl)" opacity="0.45"/>
  <rect x="1400" y="660" width="270" height="330" fill="url(#refl)" opacity="0.4"/>

  <!-- 前景：底部台沿（暗一档，形成画框） -->
  <rect y="1020" width="1920" height="60" fill="#9FAEC0" opacity="0.5"/>
  <rect y="1016" width="1920" height="5" fill="#F2F7FB" opacity="0.7"/>

  <!-- 统一主光：左上角环境光 -->
  <rect width="1920" height="1080" fill="url(#keyLight)"/>
</svg>
