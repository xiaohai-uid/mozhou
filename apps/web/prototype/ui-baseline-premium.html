/* ══════════════ WebGL 墨流背景（品牌色域；reduced-motion 时静止） ══════════════ */
(function inkShader() {
  const cv = document.getElementById('ink');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false });
  if (!gl) { cv.style.background = 'radial-gradient(ellipse at 30% 20%, #16121f 0%, #0b0a0f 60%)'; return; }
  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const fs = `
    precision highp float;
    uniform vec2 u_res; uniform float u_t;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1.,0.)), f.x),
                 mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), f.x), f.y);
    }
    float fbm(vec2 p){
      float v = 0.0, a = 0.5;
      for(int i=0;i<5;i++){ v += a*noise(p); p = p*2.03 + vec2(1.7,9.2); a *= 0.5; }
      return v;
    }
    void main(){
      vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
      float t = u_t * 0.028;
      vec2 q = vec2(fbm(uv*1.35 + t), fbm(uv*1.35 - t*0.7));
      vec2 r = vec2(fbm(uv*1.8 + q*1.6 + vec2(1.7,9.2) + t*0.55),
                    fbm(uv*1.8 + q*1.6 + vec2(8.3,2.8) - t*0.38));
      float f = fbm(uv*1.15 + r*1.9);
      vec3 base = vec3(0.043, 0.039, 0.059);
      vec3 deep = vec3(0.086, 0.078, 0.114);
      vec3 ink = mix(base, deep, smoothstep(0.18, 0.85, f));
      vec3 violet = vec3(0.545, 0.471, 1.0);
      float wisp = smoothstep(0.48, 0.98, f) * 0.10;
      ink += violet * wisp * (0.55 + 0.45*sin(uv.x*1.8 + t*2.0));
      float glow = exp(-dot(uv-vec2(-0.62,0.46), uv-vec2(-0.62,0.46)) * 1.5);
      ink += violet * glow * 0.075;
      float glow2 = exp(-dot(uv-vec2(0.85,-0.55), uv-vec2(0.85,-0.55)) * 2.2);
      ink += vec3(0.545,0.471,1.0) * glow2 * 0.045;
      float vig = smoothstep(1.3, 0.3, length(uv));
      ink *= mix(0.72, 1.0, vig);
      gl_FragColor = vec4(ink, 1.0);
    }`;
  function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uRes = gl.getUniformLocation(prog, 'u_res'), uT = gl.getUniformLocation(prog, 'u_t');
  let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    gl.viewport(0, 0, cv.width, cv.height);
  }
  addEventListener('resize', resize); resize();
  const t0 = performance.now();
  function frame(now){
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uT, (now - t0) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  addEventListener('change', () => {}, { once: true });
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', e => { reduced = e.matches; if (!reduced) requestAnimationFrame(frame); });
})();

  { who: 'e1', text: '沈铎不确定第十三响是幻听还是真实', truth: 'suspect' },
  { who: 'e2', text: '白棠相信值夜簿被人为撕页', truth: 'belief' },
  { who: 'e3', text: '钟楼 1947 年易主，买主无档', truth: 'canon' },
  { who: 'e4', text: '第十三响出现后必有一人失踪', truth: 'canon' },
];
const OUTLINE = [['第 1 章 · 值夜簿','committed'],['第 2 章 · 第十三响','committed'],['第 3 章 · 雾中来客','drafting']];
const STAGES = [['prepare','done'],['compile','done'],['draft','cur'],['review','todo'],['extract','todo'],['continuity','todo'],['proposal','todo'],['commit','todo']];
const BUBBLES = [
  { who: 'ai', text: '墨舟先问：第 3 章开在雾夜的钟楼还是白棠的档案馆？读者想看“第十三响之后发生了什么”——先给声音还是先给人？' },
  { who: 'me', text: '先给声音。守钟人视角写第十三响起，白棠章中段闯入。' },
  { who: 'ai', text: '好。起笔段已生成（草稿 d3，装配 3,120 / 4,096）：雾从江面漫上来时，沈铎正在给钟上弦……' },
];
const MATRIX = {
  chapters: ['第1章','第2章','第3章','第4章','第5章'],
  rows: [
    { n: '改写 · 值夜簿缺页', stale: '2 stale', cells: ['ok','hit','hit','hit','no'] },
    { n: '改写 · 守钟会钟约', stale: '1 stale', cells: ['ok','no','hit','hit','no'] },
    { n: '追加 · 白棠到访钟楼', stale: '—', cells: ['no','no','hit','no','no'] },
  ],
};
const QUALITY = {
  verdict: 'blocking_fail', rework: '回炉 1 / 2', anchor: 'ch3 · rev d3 · hash 9f2c… · digest a1…',
  blocking: [
    { r: 'REV-001 v3', m: '“低语”在未建立听觉前提下被写成“听见”' },
    { r: 'PARA-001 v2', m: '重复使用“雾像湿布”比喻（第 2 章已用）' },
  ],
  adv: ['期待未兑付：钟摆停摆尚未回应', '白棠档案员身份无行为支撑', '场景转换缺时间锚'],
};

/* ══════════════ 渲染小件 ══════════════ */
const truthTag = t => t === 'canon' ? '<span class="tag" style="color:var(--success)">canon</span>'
  : t === 'suspect' ? '<span class="tag" style="color:var(--warning)">suspect</span>'
  : '<span class="tag" style="color:var(--accent)">belief</span>';
let picked = null;
function pickEntity(ref) { picked = picked === ref ? null : ref; rerender(); }
function entityGrid() {
  const kinds = [...new Set(ENTITIES.map(e => e.kind))];
  return kinds.map(k => `
    <div style="margin-bottom:13px">
      <div class="faint" style="font-size:11px;letter-spacing:1.6px;margin-bottom:6px">${k.toUpperCase()}</div>
      <div class="egrid">${ENTITIES.filter(e => e.kind === k).map(e => `
        <div class="glass ecard ${picked === e.ref ? 'on' : ''}" onclick="pickEntity('${e.ref}')">
          <div class="nm">${e.name}</div><div class="br muted">${e.brief}</div>
        </div>`).join('')}</div>
    </div>`).join('');
}
function factsList() {
  const rows = picked ? FACTS.filter(f => f.who === picked) : FACTS;
  const nm = r => (ENTITIES.find(e => e.ref === r) || {}).name || r;
  return rows.map(f => `
    <div class="panel-soft" style="padding:8px 11px;margin-bottom:7px;display:flex;gap:9px;align-items:baseline">
      <span class="faint" style="font-size:12px;white-space:nowrap">${nm(f.who)}</span>
      <span style="flex:1;font-size:13px">${f.text}</span>${truthTag(f.truth)}
    </div>`).join('');
}
function outlineList() {
  return `<div class="glass" style="padding:12px 14px;margin-bottom:10px">
    <div class="card-title" style="margin-bottom:8px">卷一 · 雾季</div>
    ${OUTLINE.map(([t, s]) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:5.5px 2px;border-top:1px solid var(--hairline)">
        <span class="muted">${t}</span>
        <span class="tag" style="${s === 'drafting' ? 'color:var(--accent-strong);border-color:rgba(139,120,255,.4);box-shadow:0 0 10px rgba(139,120,255,.14)' : 'color:var(--success)'}">${s}</span>
      </div>`).join('')}
  </div>`;
}
function stageRail() { return STAGES.map(([t, s]) => `
  <div class="stage ${s}"><span class="idx">${s === 'done' ? '✓' : s === 'cur' ? '●' : ''}</span>${t}</div>`).join(''); }
function capsuleRow() { return `<div style="display:flex;flex-wrap:wrap;gap:6px">
  ${CAPSULES.map((s, i) => `<span class="capsule ${i !== 4 ? 'on' : ''}" onclick="this.classList.toggle('on')">${s}</span>`).join('')}</div>`; }
function conversation() {
  return `
    <div class="scroll" style="flex:1;padding:18px 20px">
      <div class="panel-soft" style="padding:13px 15px;margin-bottom:15px;position:relative;overflow:hidden">
        <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,120,255,.6),transparent)"></div>
        <div style="color:var(--accent-strong);font-weight:650;margin-bottom:3px" class="serif">墨舟先问</div>
        <div class="muted" style="font-size:13px">AI 先问、你先答，再动笔。回答进入下一轮装配。</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">${BUBBLES.map(b => `<div class="bubble ${b.who}">${b.text}</div>`).join('')}</div>
    </div>
    <div class="composer"><textarea placeholder="回答，或直接指挥下一笔…"></textarea><button class="primary-action">发送</button></div>`;
}
function qualityPanel() {
  return `<div class="glass" style="padding:14px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
      <span class="verdict fail">✕ ${QUALITY.verdict}</span><span class="tag">${QUALITY.rework}</span></div>
    <div class="mono faint" style="margin-bottom:10px">${QUALITY.anchor}</div>
    ${QUALITY.blocking.map(b => `<div class="qfail" style="margin-bottom:8px">
      <div style="font-weight:650;font-size:13px"><span class="mono" style="color:var(--danger)">${b.r}</span> · ${b.m}</div></div>`).join('')}
    <h3 class="sec" style="margin:10px 0 7px">ADVISORIES</h3>
    ${QUALITY.adv.map(a => `<div class="qadv" style="margin-bottom:6px;font-size:12.5px">${a}</div>`).join('')}
    <div class="unavail" style="margin-top:10px">⚠ 语义审查提供方未接入（Gate 3）：显式 REFUSED，不静默放行</div>
  </div>`;
}
function receiptPanel() {
  return `
    <div class="glass" style="padding:14px 16px;margin-bottom:12px">
      <h3 class="sec serif" style="font-size:13px;color:var(--text-muted)">装配看板 · Receipts</h3>
      <div class="panel-soft" style="padding:9px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;border-color:rgba(139,120,255,.4)">
        <div><span class="mono" style="color:var(--accent-strong)">rcpt-021</span> <span class="muted" style="font-size:12.5px">· 第 3 章草稿装配（d3）</span></div>
        <div style="display:flex;gap:8px;align-items:center"><span class="mono faint">3,120 / 4,096</span><span class="tag" style="color:var(--accent-strong);border-color:rgba(139,120,255,.4)">可续跑</span></div>
      </div>
      <div class="panel-soft" style="padding:9px 12px;display:flex;justify-content:space-between;align-items:center">
        <div><span class="mono faint">rcpt-019</span> <span class="muted" style="font-size:12.5px">· 第 2 章定稿装配</span></div>
        <span class="tag">已消费</span>
      </div>
    </div>
    <div class="glass" style="padding:14px 16px">
      <h3 class="sec">RCPT-021 · 逐条装配分解</h3>
      ${[['角色卡 · 沈铎',812,'reserved'],['角色卡 · 白棠',604,'reserved'],['大纲节 · 3.2',240,'reserved'],['前文切片 · 第2章尾',966,'story'],['文风规范 · 夜航腔',498,'fixed']].map(([k,t,q]) => `
        <div class="rentry" style="margin-bottom:6px"><span>${k}</span><span class="mono faint">${t} tok · ${q}</span></div>`).join('')}
      <div class="faint" style="margin:10px 0 4px;font-size:12px">reserved 1656 / story 1440 / fixed 498 · cap 4096</div>
      <div class="qbar"><i style="width:40%;background:linear-gradient(90deg,var(--accent),var(--accent-strong))"></i><i style="width:35%;background:rgba(128,214,176,.75)"></i><i style="width:13%;background:rgba(228,184,117,.75)"></i></div>
      <div class="mono faint" style="margin-top:9px">replay: canon@09:12 · outline@rev7 · receipt-019</div>
      <div class="muted" style="font-size:12.5px;margin-top:3px">全部条目可由 Replay Inputs 确定性重算</div>
      <button class="primary-action" style="margin-top:12px">从此凭据续跑</button>
    </div>`;
}
function matrixPanel() {
  const c = { hit: 'cell-hit', ok: 'cell-ok', no: 'cell-no' };
  const v = { hit: '需重写', ok: '已消解', no: '—' };
  return `<div class="glass" style="padding:14px 16px">
    <h3 class="sec serif" style="font-size:13px;color:var(--text-muted)">变更矩阵 · Change Matrix</h3>
    <table class="matrix">
      <tr><th style="text-align:left">Traversal</th>${MATRIX.chapters.map(x => `<th>${x}</th>`).join('')}<th>重跑</th></tr>
      ${MATRIX.rows.map(r => `<tr><td class="rowh">${r.n}<div class="faint mono" style="font-size:10.5px">${r.stale}</div></td>
        ${r.cells.map(x => `<td class="${c[x]}">${v[x]}</td>`).join('')}
        <td><button class="control" style="padding:4px 10px;font-size:12px">重跑</button></td></tr>`).join('')}
    </table>
    <div class="muted" style="font-size:12.5px;margin-top:9px">红 = 上游改动未消解 · 绿 = 重跑后消解 · 幂等 + 预算约束</div>
  </div>`;
}
const INSPECT = {
  quality: () => qualityPanel(),
  brain: () => `<div style="margin-bottom:12px">${entityGrid()}</div>
    <h3 class="sec">${picked ? '关联事实（点击实体过滤）' : '事实列表 · 点击实体可过滤'}</h3>${factsList()}`,
  receipt: () => receiptPanel(),
  matrix: () => matrixPanel(),
};

function fullNav(activeItem, onNav) {
  return NAV.map(gr => `
    <div class="nav-label">${gr.g}</div>
    ${gr.items.map(([t, i, n]) => `
      <button class="nav-item ${activeItem === t ? 'on' : ''}" onclick="${onNav ? onNav.replace('%S', t) : 'void 0'}">
        <span class="nav-ico">${i}</span>${t}${n ? `<span class="badge">${n}</span>` : ''}
      </button>`).join('')}`).join('');
}

/* ══════════════ 高级版旗舰：专注工作台 + 功能抽屉 + 右栏检视塔 ══════════════ */
let drawer = false, tab = 'quality';
function render() {
  return `
    <div class="scrim ${drawer ? 'open' : ''}" onclick="drawer=false;rerender()"></div>
    <div class="drawer ${drawer ? 'open' : ''}">
      <div style="padding:15px 16px 11px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--hairline)">
        <div class="brand"><span class="brand-glyph">墨</span>
          <div><div class="brand-name">墨舟</div><div class="brand-sub">夜墨编辑工作室</div></div></div>
        <div style="flex:1"></div>
        <button class="control" style="padding:5px 10px;font-size:12.5px" onclick="drawer=false;rerender()">✕</button>
      </div>
      <div style="padding:11px 13px 6px"><input class="control" style="width:100%;outline:none" placeholder="搜索功能、技能、动作…"></div>
      <div class="scroll" style="flex:1;padding-bottom:12px">${fullNav(null, `drawer=false;toast('%S')`)}</div>
      <div class="faint" style="padding:11px 16px;border-top:1px solid var(--hairline);font-size:11.5px">
        内置执行器 6 · 广场 3 · oh-story 13 · 我的 4
      </div>
    </div>
    <div class="shell">
      <div class="topbar">
        <button class="control" style="padding:6px 13px;font-size:13px" onclick="drawer=true;rerender()">☰ 全部功能</button>
        <div class="brand"><span class="brand-glyph">墨</span>
          <div><div class="brand-name">墨舟</div></div></div>
        <div class="muted" style="font-size:13px">${BOOK.title} · ${BOOK.chapter}</div>
        <div style="flex:1"></div>
        <span class="control" style="padding:5px 12px;font-size:12.5px;color:var(--text-faint)">⌘K</span>
        <button class="control" style="padding:6px 12px;font-size:12.5px">☑ 任务 <span class="badge">2</span></button>
      </div>
      <div class="body">
        <div class="glass-strong rise d1" style="width:224px;flex:0 0 auto;display:flex;flex-direction:column;padding:6px 0">
          <div class="nav-label">当前作品</div>
          <div class="panel-soft" style="margin:4px 9px 10px;padding:11px 13px">
            <div class="card-title" style="font-size:15px">${BOOK.title}</div>
            <div class="muted" style="font-size:12px">${BOOK.chapter}</div>
            <div class="faint mono" style="margin-top:5px">${BOOK.words}</div>
            <div class="qbar" style="margin-top:8px"><i style="width:80%;background:linear-gradient(90deg,var(--accent),var(--accent-strong))"></i></div>
          </div>
          <div style="padding:0 7px">
            ${[['✍','写作对话',1],['▤','章节与大纲',0],['⚇','人物关系',0],['◈','世界规则',0]].map(([i, t, on]) => `
              <button class="nav-item ${on ? 'on' : ''}"><span class="nav-ico">${i}</span>${t}</button>`).join('')}
          </div>
          <div style="flex:1"></div>
          <div class="faint" style="padding:11px 13px;font-size:11.5px;line-height:1.7">工作台独占全屏<br>其余 16 功能走 ☰ 抽屉</div>
        </div>
        <div class="center glass-strong rise d2" style="overflow:hidden">${conversation()}</div>
        <div class="rightbar">
          <div class="glass-strong rise d2" style="padding:12px 14px">
            <h3 class="sec">本次链路 · 阶段轨（管线十步）</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;column-gap:14px">${stageRail()}</div>
          </div>
          <div class="glass-strong rise d3" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
            <div style="display:flex;gap:5px;padding:10px 12px 0">
              ${[['quality','质量门'],['brain','实体'],['receipt','装配'],['matrix','矩阵']].map(([k, t]) => `
                <button class="railtab ${tab === k ? 'on' : ''}" onclick="tab='${k}';rerender()">${t}</button>`).join('')}
            </div>
            <div class="scroll" style="flex:1;padding:12px 14px">${INSPECT[tab]()}</div>
          </div>
          <div class="glass-strong rise d3" style="padding:12px 14px">
            <h3 class="sec">技能胶囊 · 内置 6 / 广场 3 / 我的 4</h3>
            ${capsuleRow()}
          </div>
        </div>
      </div>
    </div>`;
}
function toast(name) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;background:rgba(30,26,38,.92);backdrop-filter:blur(14px);border:1px solid rgba(139,120,255,.4);border-radius:9px;padding:9px 16px;font-size:13px;box-shadow:0 10px 34px rgba(0,0,0,.5)';
  t.textContent = `「${name}」→ 独立功能页打开（原型占位）`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1600);
}
function rerender() { document.getElementById('app').innerHTML = render(); }
rerender();
</script>
</body>
</html>
