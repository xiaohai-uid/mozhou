          {"name": "id", "in": "path", "required": true, "schema": { "type": "integer" }},
          {"name": "chapterId", "in": "query", "required": true, "schema": { "type": "integer" }}
        ],
        "responses": {
          "200": {
            "description": "{stopped:boolean}；命中时补写 cancelled SSE 事件并按 cancelled 记账"
          },
          "400": {
            "description": "参数非法"
          },
          "401": {
            "description": "未登录"
          },
          "404": {
            "description": "章节不存在或不属于当前用户"
          }
        }
      }
    },
    "/api/v1/novels/{id}/chapters/messages/{messageId}/discard": {
      "post": {
        "summary": "丢弃AI候选回复（不改正文）",
        "operationId": "discardChapterMessage",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": { "type": "integer" }},
          {"name": "messageId", "in": "path", "required": true, "schema": { "type": "integer" }},
          {"name": "chapterId", "in": "query", "required": true, "schema": { "type": "integer" }}
        ],
        "responses": {
          "200": {
            "description": "{ok:true, status:'discarded'}"
          },
          "400": {
            "description": "参数缺失"
          },
          "401": {
            "description": "未登录"
          },
          "404": {
            "description": "候选不存在/不归属/状态不可丢弃"
          }
        }
      }
    },
    "/api/v1/novels/{id}/chapters/messages/{messageId}/insert": {
      "post": {
        "summary": "确认插入候选到章节正文",
        "operationId": "insertChapterMessage",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": { "type": "integer" }},
          {"name": "messageId", "in": "path", "required": true, "schema": { "type": "integer" }},
          {"name": "chapterId", "in": "query", "required": true, "schema": { "type": "integer" }}
        ],
        "responses": {
          "200": {
            "description": "事务写入 revision+1，候选置 applied。响应体 {chapter:{content,revision,updatedAt}, messageId, message:{inserted}, qualityGate}；chapter.revision 供客户端推进保存基线（DELTA-003）"
          },
          "400": {
            "description": "模式/位置/区间等校验失败（position/range 不静默 clamp）"
          },
          "401": {
            "description": "未登录"
          },
          "404": {
            "description": "章节或候选不存在"
          },
          "409": {
            "description": "冲突：{error, code:'ContentChanged'}——expectedContent 与当前正文不一致，或 CAS 竞态失败；确认后带 force:true 重发（DELTA-003 后基线过期不再拒绝）"
          }
        }
      }
    },
    "/api/v1/account": {
      "get": {
        "summary": "账户概览（tier+用量）",
        "operationId": "account",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "email": {
                      "type": "string"
                    },
                    "plan": {
                      "type": "string"
                    },
                    "quota": {
                      "type": "object"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/health": {
      "get": {
        "summary": "存活 + 数据库可达性探测（公开，无业务数据）",
        "operationId": "healthProbe",
        "responses": {
          "200": {
            "description": "实例存活且 db 可达：{ ok: true, db: 'up', uptimeSec }",
            "content": { "application/json": { "schema": { "type": "object" } } }
          },
          "503": {
            "description": "实例存活但 db 不可达：{ ok: true, db: 'down', uptimeSec }——编排层据此摘流/重启",
            "content": { "application/json": { "schema": { "type": "object" } } }
          }
        }
      }
    }
  },
  "components": {
    "responses": {
      "RateLimited": {
        "description": "Too Many Requests：触发限流；Retry-After 头为建议等待秒数。桶与阈值见 api-contract.md §25",
        "content": { "application/json": { "schema": { "type": "object" } } }
      }
    },
    "schemas": {
      "Session": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "title": {
            "type": "string"
          },
          "novelId": {
            "type": "integer",
            "nullable": true
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
    }
  }
}