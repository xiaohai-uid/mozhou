      }
    },
    "/api/v1/chat": {
      "post": {
        "summary": "流式写作对话（SSE）",
        "operationId": "chatSend",
        "responses": {
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "200": {
            "description": "SSE stream (text/event-stream)"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "sessionId": {
                    "type": "integer",
                    "nullable": true
                  },
                  "model": {
                    "type": "string",
                    "enum": [
                      "deepseek-v4-flash",
                      "glm-4.5-flash"
                    ]
                  },
                  "content": {
                    "type": "string"
                  },
                  "novelId": {
                    "type": "integer",
                    "nullable": true
                  },
                  "style": {
                    "type": "string",
                    "nullable": true
                  },
                  "skills": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "description": "技能名（我的技能 + 开关型内置技能：章节规划/读者与题材/叙事声音）。开关型未列出不注入；基础设施内置（故事状态/成稿质量门）不受此列表控制，始终注入（DELTA-004）"
                  }
                },
                "required": [
                  "content"
                ]
              }
            }
          }
        }
      }
    },
    "/api/v1/novels": {
