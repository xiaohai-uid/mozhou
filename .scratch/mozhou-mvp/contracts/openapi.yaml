      },
      "patch": {
        "summary": "编辑作品（含 ragEnabled）",
        "operationId": "novelUpdate",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "ragEnabled": {
                    "type": "boolean"
                  }
                }
              }
            }
          }
        }
      },
      "delete": {
        "summary": "删除作品",
        "operationId": "novelDelete",
        "responses": {
          "200": {
            "description": "OK"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer"
            }
          }
        ]
      }
    },
    "/api/v1/novels/{id}/chapters": {
      "post": {
        "summary": "新建章节",
        "operationId": "chapterCreate",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string"
                  }
                },
                "required": [
                  "title"
                ]
              }
            }
          }
        }
      },
      "patch": {
        "summary": "更新章节（标题/状态/正文；正文保存必须携带 expectedRevision 做乐观并发）",
        "operationId": "chapterUpdate",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "integer" }
          },
          {
            "name": "chapterId",
            "in": "query",
            "required": true,
            "schema": { "type": "integer" }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": { "type": "string" },
                  "status": { "type": "string", "enum": ["draft", "final"] },
                  "content": { "type": "string" },
                  "expectedRevision": {
                    "type": "integer",
                    "minimum": 0,
                    "description": "比较并交换：与当前 revision 不一致 → 409 ContentChanged；未携带则无条件写入（客户端保存正文时必须携带）"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "更新后的章节行（含 revision）",
            "content": { "application/json": { "schema": { "type": "object" } } }
          },
          "400": {
            "description": "参数缺失/非法",
            "content": { "application/json": { "schema": { "type": "object" } } }
          },
          "404": {
            "description": "章节不存在或不归属当前用户",
            "content": { "application/json": { "schema": { "type": "object" } } }
          },
          "409": {
            "description": "ContentChanged：expectedRevision 与当前 revision 不一致；响应含当前章节行供客户端对账",
            "content": { "application/json": { "schema": { "type": "object" } } }
          }
        }
      }
    },
    "/api/v1/novels/{id}/chapters/chat": {
      "post": {
        "summary": "章节对话（SSE 流式续写/问答，按用户限流）",
        "operationId": "chapterChat",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "integer" }
          },
          {
            "name": "chapterId",
            "in": "query",
            "required": true,
            "schema": { "type": "integer" }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "content": { "type": "string" },
                  "skills": {
                    "type": "array",
                    "items": { "type": "string" },
                    "description": "技能名（场景技能 + 我的技能 + 开关型内置：章节规划/读者与题材/叙事声音）。开关型未列出不注入；基础设施内置（故事状态/成稿质量门）始终注入（DELTA-004）"
                  },
                  "styleId": { "type": "integer", "nullable": true },
                  "generationKey": { "type": "string" }
                },
                "required": ["content"]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "SSE 事件流（start/phase/delta/error/done 事件序）",
            "content": { "text/event-stream": { "schema": { "type": "string" } } }
          },
          "400": {
            "description": "参数缺失/非法",
            "content": { "application/json": { "schema": { "type": "object" } } }
          },
          "404": {
            "description": "章节不存在或不归属当前用户",
            "content": { "application/json": { "schema": { "type": "object" } } }
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          }
        }
      }
    },
    "/api/v1/novels/{id}/entries": {
