                    "skills": {
                      "type": "array"
                    },
                    "ohStorySkills": {
                      "type": "array"
                    },
                    "builtinSkills": {
                      "type": "array",
                      "description": "内置五角色技能定义（DELTA-004：toggleable 标记开关型——进胶囊由用户选择；基础设施型始终注入）",
                      "items": {
